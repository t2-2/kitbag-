  try{await loadXlsx();var wb=XLSX.read(await f.arrayBuffer(),{type:'array'}),a=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:''});
   var H={f:/שם פרטי|first/i,l:/משפחה|last/i,g:/שכבה|grade/i,e:/מייל|דוא|mail/i},ix={f:0,l:1,g:2,e:3},hd=a[0]||[],found=0;Object.keys(H).forEach(function(k){var p=hd.findIndex(function(c){return H[k].test(String(c))});if(p>-1){ix[k]=p;found++}});
   var body=(found>=3?a.slice(1):a).filter(function(r){return r.some(function(c){return String(c).trim()})}).map(function(r){return {firstName:String(r[ix.f]||''),lastName:String(r[ix.l]||''),grade:String(r[ix.g]||''),email:String(r[ix.e]||'')}});

   $('#go',s.el).onclick=async function(){var g=$('#go',s.el);g.disabled=true;try{var r=await client.mutation('ops:importCommit',{token:token,rows:body});pv.innerHTML='<div class="card"><b>יובאו '+r.inserted+' שוחרים</b><p class="muted">דולגו '+r.skipped+'. לכל שוחר נוצר שם משתמש.</p></div><button class="btn block" id="su">שליחת שמות משתמש למיילים</button><button class="btn ghost block" id="cx" style="margin-top:8px">סגור</button>';$('#cx',s.el).onclick=s.close;$('#su',s.el).onclick=function(){sendUsernames(this)}}catch(x){$('#m',s.el).textContent=errMsg(x);g.disabled=false}}
  }catch(x){console.error(x);pv.innerHTML='<p class="err">לא ניתן לקרוא את הקובץ</p>'}}}

var CAT=null;async function catalog(){if(!CAT)CAT=await client.query('requests:catalog',{token:token});return CAT}
function sigSheet(title,sub1,fn){var s=sheet('<h2>'+title+'</h2><p class="muted">'+sub1+'</p><canvas id="cv" class="cv" width="640" height="260"></canvas><p class="err" id="m"></p><div class="bar"><button class="btn ghost" id="cl">נקה</button><button class="btn" id="go" style="flex:1">חתום ושלח</button></div>');
 var cv=$('#cv',s.el),x=cv.getContext('2d'),draw=false,ink=false;x.lineWidth=5;x.lineCap='round';x.strokeStyle='#0E1A2B';
 var pt=function(e){var r=cv.getBoundingClientRect();return [(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};
 cv.onpointerdown=function(e){draw=true;ink=true;cv.setPointerCapture(e.pointerId);var p=pt(e);x.beginPath();x.moveTo(p[0],p[1]);x.lineTo(p[0]+.1,p[1])};
 cv.onpointermove=function(e){if(!draw)return;var p=pt(e);x.lineTo(p[0],p[1]);x.stroke()};cv.onpointerup=function(){draw=false};
 $('#cl',s.el).onclick=function(){x.clearRect(0,0,cv.width,cv.height);ink=false};
 var go=$('#go',s.el);go.onclick=async function(){if(!ink){$('#m',s.el).textContent='יש לחתום בתוך המסגרת';return}go.disabled=true;
  try{await fn(cv.toDataURL('image/png'));s.close()}catch(e){$('#m',s.el).textContent=errMsg(e);go.disabled=false}}}

 '<div class="card"><b>הבקשות שלי</b>'+(mine.length?mine.map(function(r){return '<div class="row"><div class="who"><b>'+ST[r.status]+'</b><span class="muted">'+itemsTxt(r.items)+(r.note?' · '+esc(r.note):'')+'</span></div>'+(r.status==='pending'?'<button class="btn ghost sm" data-cn="'+r._id+'">ביטול</button>':'')+'</div>'}).join(''):'<p class="muted">עדיין אין בקשות</p>')+'</div>'+
 (cd.notes.length?'<div class="card"><b>התראות</b>'+cd.notes.map(function(n){return '<p class="muted"><b>'+esc(n.title)+'</b> '+esc(n.body)+'</p>'}).join('')+'</div>':'');

 add();$('#ad',s.el).onclick=add;s.el.querySelectorAll('[data-k]').forEach(function(b){b.onclick=function(){kind=b.dataset.k;s.el.querySelectorAll('[data-k]').forEach(function(x){x.setAttribute('aria-pressed',x===b)})}});

function vReq(){$('#v').innerHTML='<h1>בקשות</h1><div id="rq"></div>';

async function boot(){var host=$('#boot .anim'),word=$('#boot-word'),reduce=matchMedia('(prefers-reduced-motion: reduce)').matches,t0=performance.now(),loop=null;
 if(window.lottie){if(reduce){var d=lottie.loadAnimation({container:host,renderer:'svg',loop:false,autoplay:false,animationData:DONE});d.goToAndStop(89,true)}else loop=lottie.loadAnimation({container:host,renderer:'svg',loop:true,autoplay:true,animationData:LOADER,rendererSettings:{preserveAspectRatio:'xMidYMid meet'}})}
