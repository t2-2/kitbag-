function sheet(html){var sc=document.createElement('div');sc.className='scrim';sc.innerHTML='<div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>'+html+'</div>';$('#sheet-root').appendChild(sc);
 var close=function(){sc.classList.add('closing');setTimeout(function(){sc.remove()},220)};sc.addEventListener('click',function(e){if(e.target===sc)close()});return {el:sc,close:close}}
function gate(){$('#app').innerHTML='<div class="gate"><div class="logo-big">'+BAG+'<div class="wm">KITBAG<b>+</b></div></div><p class="lead">ניהול ציוד אישי ולוגיסטיקה</p><div class="roles"><button class="role" data-r="commander"><span class="ri">'+IC.shield+'</span><span><b>מפקד</b><span>ניהול שוחרים, מלאי ובקשות</span></span></button><button class="role" data-r="cadet"><span class="ri">'+IC.user+'</span><span><b>שוחר</b><span>הציוד שלי, בקשות וחתימות</span></span></button></div>'+(client?'':'<p class="hint" style="color:#C0392F">חסר convexUrl בראש הקובץ (KITBAG_CONFIG)</p>')+'</div>';
 document.querySelectorAll('.role').forEach(function(b){b.onclick=function(){login(b.dataset.r)}})}
function login(role){var cmd=role==='commander';
 var s=sheet('<h2>'+(cmd?'כניסת מפקד':'כניסת שוחר')+'</h2><p class="muted">'+(cmd?'שם משתמש וסיסמה':'תעודת זהות וקוד אישי שהנפיק המפקד')+'</p><input class="in" id="a" dir="ltr" autocomplete="username" placeholder="'+(cmd?'שם משתמש':'תעודת זהות')+'"><input class="in" id="b" dir="ltr" type="password" autocomplete="current-password" placeholder="'+(cmd?'סיסמה':'קוד אישי')+'"><p class="err" id="m" role="alert"></p><button class="btn block" id="go">כניסה</button>');

 $('#app').innerHTML='<header class="appbar"><span class="brand">KITBAG+</span><span class="sp"></span><span class="pill">'+(role==='commander'?'מפקד':'שוחר')+'</span><button class="btn ghost" id="out" style="min-height:40px;padding:0 14px">יציאה</button></header><main><h1>שלום '+esc(me.name)+'</h1><p class="muted">הכניסה אומתה בשרת. המסכים הבאים (שוחרים, מלאי, בקשות, חתימות) נבנים בשלבים הבאים.</p><div class="card muted">'+(role==='commander'?'לוח בקרה — בקרוב':'התיק האישי שלך — בקרוב')+'</div></main>';
